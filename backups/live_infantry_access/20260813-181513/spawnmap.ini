[Briefing]
1=Our logistics center has become bogged down in a fiasco.
2=While the first major shipment from Europe arrived without issue, the second has yet to show,
3=and Nod has launched an assault on the facility. To make matters worse, despite our efforts to avoid antagonizing GDI,
4=the eagle is also focused on the facility's destruction.
5=@@You must take control at the logistics site and immediately put the situation in order.
6=Defend your position until the second shipment from Europe arrives.
7=Then use our new weapons to wipe all foreign occupiers from the region.
8=@@Objective 1: Defend your position until the shipment arrives.
9=@@Objective 2: Eliminate all GDI and Nod forces in the area.
10=@@Objective 3: The Sub Pen and Logistics Center must remain intact.


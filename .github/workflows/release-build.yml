name: Validate manual release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and release versions
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Validate static configuration
        run: >-
          python -c "from randomizer.config.static import
          REQUIRED_STATIC_CONFIGS, validate_static_configs;
          validate_static_configs(REQUIRED_STATIC_CONFIGS)"

      - name: Validate versions and committed APWorld
        shell: powershell
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $expectedVersion = if ($env:RELEASE_REF_TYPE -eq 'tag') {
            $env:RELEASE_REF_NAME
          } else {
            ''
          }
          .\check_release_files.ps1 -ExpectedVersion $expectedVersion
